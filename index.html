<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="initial-scale=1, maximum-scale=1.0, minimum-scale=1.0, width=device-width, minimal-ui">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
        <title>GTM Template validator</title>
        <style>
          .vh-50 {
            height: 50vh;
          }
          .output-list .list-group-item {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
          }
        </style>
    </head>
    <body>
        <div class="text-center">
          <h1>Google Tag Manager template validator</h1>
        </div>
        <div class="container">
          <div class="row">
            <div class="col-6">
              <form id="code-form" method="post">
                <div class="mb-3">
                  <label for="template-code" class="form-label">Template code (tpl)</label>
                  <textarea id="template-code" class="form-control vh-50" placeholder="___TERMS_OF_SERVICE___ ...."></textarea>
                </div>
                <div>
                  <button class="btn btn-primary">Validate</button>
                </div>
              </form>
              <h2>Output:</h2>
              <ul id="errors-container" class="list-group output-list"></ul>
            </div>
            <div class="col-6">
              <form id="metadata-form" method="post">
                <div class="mb-3">
                  <label for="template-metadata" class="form-label">Metadata.yaml</label>
                  <textarea id="template-metadata" class="form-control vh-50" placeholder="  # Latest version
  - sha: 62ac746168b5aa2d213ed0b42d75128b03f49764
    changeNotes: v6.2
      Rollback changes to see if google updates the template again..."></textarea>
                </div>
                <div>
                  <button class="btn btn-primary">Validate</button>
                </div>
              </form>
              <h2>Output:</h2>
              <ul id="errors-metadata-container" class="list-group output-list"></ul>
            </div>
          </div>
        </div>
        <script type="module">
          import { validateTemplate } from './src/validator.js';
          import { load as loadYaml } from './src/vendor/js-yaml.js';

          const CODE_STORAGE_KEY = 'code';

          function getList(formId) {
            return document.getElementById(formId).parentElement.querySelector('.list-group');
          }

          function addItem(list, text, variant) {
            const item = document.createElement('li');
            item.className = `list-group-item list-group-item-${variant}`;
            item.textContent = text;
            list.append(item);
          }

          function clearList(list) {
            list.innerHTML = '';
          }

          function renderTemplateResult(result) {
            const list = getList('code-form');
            clearList(list);

            for (const error of result.errors) {
              addItem(list, `${formatBlock(error.block)}: ${error.message}`, 'danger');
            }
            for (const warning of result.warnings) {
              addItem(list, `${formatBlock(warning.block)}: ${warning.message}`, 'warning');
            }

            const summary = result.errors.length === 0 && result.warnings.length === 0
              ? 'Validation finished: no issues found'
              : `Validation finished: ${result.errors.length} error(s), ${result.warnings.length} warning(s)`;

            addItem(list, summary, result.errors.length === 0 ? 'success' : 'dark');
          }

          function renderMetadataResult(result) {
            const list = getList('metadata-form');
            clearList(list);

            for (const error of result.errors) {
              addItem(list, error, 'danger');
            }

            if (result.errors.length === 0) {
              addItem(list, 'Is valid', 'success');
            }
          }

          function formatBlock(block) {
            return block ? block.replace(/^_+|_+$/g, '') : 'Template';
          }

          document.getElementById('code-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const code = document.querySelector('#code-form textarea').value;
            localStorage.setItem(CODE_STORAGE_KEY, code);

            try {
              renderTemplateResult(validateTemplate(code));
            } catch (error) {
              const list = getList('code-form');
              clearList(list);
              addItem(list, `Unexpected validation error: ${error.message}`, 'danger');
            }
          });

          document.getElementById('metadata-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const code = document.querySelector('#metadata-form textarea').value;
            renderMetadataResult(validateMetadata(code));
          });

          const savedCode = localStorage.getItem(CODE_STORAGE_KEY);
          if (savedCode) {
            document.querySelector('#code-form textarea').value = savedCode;
          }

          function validateMetadata(str) {
            const errors = [];
            let obj;

            try {
              obj = loadYaml(str);
            } catch (error) {
              errors.push(`${error.message}. Check it on https://www.yamllint.com/`);
              return { errors };
            }

            if (!obj) {
              errors.push('Empty YAML received');
              return { errors };
            }

            const conclusion = validateObject(obj, [
              { name: 'homepage', required: true, type: 'string' },
              { name: 'documentation', required: true, type: 'string' },
              {
                name: 'versions', required: true, type: 'array',
                child_schema: [
                  { name: 'sha', required: true, type: 'string' },
                  { name: 'changeNotes', required: true, type: 'string' }
                ]
              }
            ]);

            if (!conclusion.valid) {
              errors.push(`${conclusion.error}. Check it on https://www.yamllint.com/`);
            }

            return { errors };
          }

          function validateObject(obj, schema) {
            const validateField = (value, fieldSchema) => {
              if (fieldSchema.required && value === undefined) {
                return `${fieldSchema.name} is required.`;
              }
              if (value !== undefined) {
                switch (fieldSchema.type) {
                  case 'string':
                    if (typeof value !== 'string') return `${fieldSchema.name} must be a string.`;
                    break;
                  case 'int':
                    if (!Number.isInteger(value)) return `${fieldSchema.name} must be an integer.`;
                    break;
                  case 'boolean':
                  case 'bool':
                    if (typeof value !== 'boolean') return `${fieldSchema.name} must be a boolean.`;
                    break;
                  case 'simple_array':
                    if (!Array.isArray(value)) return `${fieldSchema.name} must be an array.`;
                    for (let item of value) {
                      const error = validateField(item, fieldSchema.child_schema);
                      if (error) return error;
                    }
                    break;
                  case 'array':
                    if (!Array.isArray(value)) return `${fieldSchema.name} must be an array.`;
                    for (let item of value) {
                      for (let childField of fieldSchema.child_schema) {
                        const error = validateField(item[childField.name], childField);
                        if (error) return error;
                      }
                    }
                    break;
                  case 'object': {
                    const conclusion = validateObject(value, fieldSchema.child_schema);
                    if (!conclusion.valid) return conclusion.error;
                    break;
                  }
                  default:
                    return `Unknown type for ${fieldSchema.name}.`;
                }
              }
              return null;
            };

            for (let field of schema) {
              const error = validateField(obj[field.name], field);
              if (error) return { valid: false, error, obj, field };
            }

            return { valid: true };
          }
        </script>
    </body>
</html>
